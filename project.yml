name: RizeDesktop
options:
  bundleIdPrefix: com.rizeclone
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# RIZ-55: base xcconfig applied to every configuration. Config.example.xcconfig
# is committed with safe defaults (see that file for how to override values
# locally via a gitignored Config.local.xcconfig without editing this file).
configFiles:
  Debug: Config.example.xcconfig
  Release: Config.example.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "6.29.0"

targets:
  RizeDesktop:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/RizeDesktop
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rizeclone.desktop
        PRODUCT_NAME: RizeDesktop
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: true
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Sources/RizeDesktop/App/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © RizeClone."
        RIZE_BACKEND_BASE_URL: "$(RIZE_BACKEND_BASE_URL)"
        # ATS: allows plain-HTTP to the integration backend (bare-IP host). MUST be removed/replaced with TLS before any App Store submission.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  RizeDesktopTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/RizeDesktopTests
    settings:
      base:
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - target: RizeDesktop

schemes:
  RizeDesktop:
    build:
      targets:
        RizeDesktop: all
        RizeDesktopTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RizeDesktopTests
    archive:
      config: Release
