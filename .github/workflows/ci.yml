name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  # RIZ-42: minimum acceptable app-target line coverage, percent. Raise this
  # over time as coverage improves; keep it as the single knob for the gate.
  COVERAGE_THRESHOLD: 50

jobs:
  build-test-lint:
    runs-on: macos-15
    # RIZ-58: Test step (and everything downstream of it: the coverage gate
    # and its reports) is temporarily skipped per user decision — GitHub
    # Actions billing is blocked and desktop test runs previously hung
    # runners. Flip this single flag to "true" to re-enable the Test step
    # and all coverage machinery together.
    env:
      RIZ_58_TESTS_ENABLED: "false"
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: brew install xcodegen swiftlint swiftformat

      - name: Generate Xcode project
        run: make generate

      - name: Build
        run: |
          xcodebuild -project RizeDesktop.xcodeproj -scheme RizeDesktop \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Test
        # RIZ-58: temporarily skipped per user decision — re-enable by
        # flipping RIZ_58_TESTS_ENABLED to "true" above.
        if: ${{ env.RIZ_58_TESTS_ENABLED == 'true' }}
        run: |
          rm -rf TestResults.xcresult
          xcodebuild -project RizeDesktop.xcodeproj -scheme RizeDesktop \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            -enableCodeCoverage YES -resultBundlePath TestResults.xcresult \
            test

      - name: Coverage gate
        # RIZ-58: gated with the Test step above; see RIZ_58_TESTS_ENABLED.
        if: ${{ env.RIZ_58_TESTS_ENABLED == 'true' }}
        run: scripts/coverage-check.sh TestResults.xcresult

      - name: Append coverage summary
        # RIZ-58: gated with the Test step above; runs even if the coverage
        # gate step fails so the summary still shows why.
        if: ${{ always() && env.RIZ_58_TESTS_ENABLED == 'true' }}
        run: |
          if [ -f coverage-summary.txt ]; then
            cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage reports
        # RIZ-58: gated with the Test step above.
        if: ${{ always() && env.RIZ_58_TESTS_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ github.sha }}
          path: |
            coverage-report.txt
            coverage-report.json
          if-no-files-found: warn

      - name: Post coverage summary on PR
        # RIZ-58: gated with the Test step above.
        if: ${{ always() && env.RIZ_58_TESTS_ENABLED == 'true' && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          path: coverage-summary.txt

      - name: SwiftLint
        run: swiftlint --strict

      - name: SwiftFormat (lint)
        run: swiftformat --lint .

      # Unsigned Release build attached to every PR/push for manual smoke-testing.
      # Not notarized; Developer ID signing + notarization is a later ticket.
      - name: Build (Release, unsigned)
        run: |
          xcodebuild -project RizeDesktop.xcodeproj -scheme RizeDesktop \
            -configuration Release CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build build

      - name: Zip .app
        run: |
          APP_PATH="build/Build/Products/Release/RizeDesktop.app"
          ditto -c -k --keepParent "$APP_PATH" RizeDesktop.zip

      - name: Upload unsigned app artifact
        uses: actions/upload-artifact@v4
        with:
          name: RizeDesktop-unsigned-${{ github.sha }}
          path: RizeDesktop.zip
