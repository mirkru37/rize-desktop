name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test-lint:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: brew install xcodegen swiftlint swiftformat

      - name: Generate Xcode project
        run: make generate

      - name: Build
        run: |
          xcodebuild -project RizeDesktop.xcodeproj -scheme RizeDesktop \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Test
        # Temporarily skipped per user decision — re-enable via RIZ-58
        if: ${{ false }}
        run: |
          xcodebuild -project RizeDesktop.xcodeproj -scheme RizeDesktop \
            -configuration Debug CODE_SIGNING_ALLOWED=NO test

      - name: SwiftLint
        run: swiftlint --strict

      - name: SwiftFormat (lint)
        run: swiftformat --lint .

      # Unsigned Release build attached to every PR/push for manual smoke-testing.
      # Not notarized; Developer ID signing + notarization is a later ticket.
      - name: Build (Release, unsigned)
        run: |
          xcodebuild -project RizeDesktop.xcodeproj -scheme RizeDesktop \
            -configuration Release CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build build

      - name: Zip .app
        run: |
          APP_PATH="build/Build/Products/Release/RizeDesktop.app"
          ditto -c -k --keepParent "$APP_PATH" RizeDesktop.zip

      - name: Upload unsigned app artifact
        uses: actions/upload-artifact@v4
        with:
          name: RizeDesktop-unsigned-${{ github.sha }}
          path: RizeDesktop.zip
